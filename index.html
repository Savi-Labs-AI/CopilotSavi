: "Asistencia al agente, no respuesta automática al consumidor."}, {"t": "card", "title": "Preparar respuesta al consumidor", "app": "Chat / Agente", "x": "El consumidor pregunta: «[consulta]». Busca únicamente en la documentación aprobada de la promoción [X]. Indica la respuesta aplicable, cita la condición exacta y señala cualquier dato que deba confirmar antes de responder. No inventes excepciones.", "tip": "Sin datos personales del consumidor en el prompt."}, {"t": "card", "title": "Condiciones de una promoción", "app": "Chat", "x": "Según las condiciones de [promoción], prepara una respuesta al consumidor. Cita la cláusula y señala qué datos faltan.", "tip": "Revisa tono y datos personales."}, {"t": "card", "title": "Resumir una reclamación", "app": "Outlook", "x": "Resume esta reclamación: motivo, historial, lo que pide el consumidor y qué debería escalarse.", "tip": "Las reclamaciones se escalan según el protocolo."}, {"t": "card", "title": "Seguimiento de incidencias en Teams", "app": "Teams", "x": "Resume los mensajes accesibles de este hilo de Customer Care, identificando incidencias, soluciones confirmadas y temas pendientes. Cita los mensajes relevantes; no asumas que tienes todo el canal.", "tip": "Hilo accesible ≠ histórico completo del canal."}, {"t": "card", "title": "Explorar estadísticas de buzón", "app": "Copilot App / Agente", "x": "Para el buzón [buzón] y el periodo [fechas], identifica qué volumen, asuntos recurrentes y datos puedes comprobar con las fuentes disponibles. Separa cifras verificadas de métricas que requerirían extracción completa. No calcules SLA, backlog ni tiempos de respuesta sin datos y metodología suficientes.", "tip": "Para métricas oficiales hacen falta definiciones y registros completos."}]}, {"id": "operaciones-y-validacion", "name": "Operaciones y Validación", "tagline": null, "blocks": [{"t": "p", "x": "Los casos más seguros: recuperar procedimientos y comparar versiones."}, {"t": "card", "title": "Condiciones de validez", "app": "Chat / Word", "x": "Según exclusivamente los documentos proporcionados, indica qué condiciones debe cumplir una participación para ser válida. Para cada condición cita documento y sección. Si dos fuentes se contradicen, no elijas una: señala la contradicción.", "tip": "Nunca le pidas que «decida» si es válida sin decir qué documento manda."}, {"t": "card", "title": "Comparar versiones de bases", "app": "OneDrive", "x": "Compara estos documentos solo en condiciones, plazos, excepciones y responsabilidades.", "tip": "Comprueba la vigencia de cada versión."}, {"t": "card", "title": "Estructurar una incidencia", "app": "Chat", "x": "Ordena esta incidencia en: qué ocurre, a quién afecta, procedimiento aplicable (con fuente) y siguiente paso. Indica qué datos faltan.", "tip": "Copilot propone; la decisión es tuya."}, {"t": "card", "title": "Agente de procedimientos", "app": "Agente (futuro)", "x": "Responde exclusivamente con procedimientos vigentes y aprobados proporcionados. Cita documento y sección. Si falta información o hay contradicciones, recomienda escalar sin decidir por tu cuenta.", "tip": "Solo con versionado y permisos resueltos."}]}, {"id": "finanzas-y-administracion", "name": "Finanzas y Administración", "tagline": null, "blocks": [{"t": "p", "x": "Copilot acelera el análisis; los controles contables siguen siendo tuyos."}, {"t": "card", "title": "Presupuesto vs real", "app": "Excel", "x": "Compara presupuesto y real por categoría. Calcula desviación absoluta y porcentual. Ordena por impacto económico. Muéstrame las fórmulas o el razonamiento antes de redactar conclusiones.", "tip": "El libro y sus fórmulas son la fuente de auditoría."}, {"t": "card", "title": "Posibles duplicados", "app": "Excel", "x": "Busca registros potencialmente duplicados usando [campos]. No elimines nada: crea una lista para revisión.", "tip": "Siempre una lista para revisar, nunca borrado automático."}, {"t": "card", "title": "Anomalías mensuales", "app": "Analyst", "x": "Analiza la evolución mensual y señala valores atípicos. Distingue un dato atípico estadístico de un error confirmado.", "tip": "No lo uses como control financiero final."}]}, {"id": "direccion-y-responsables", "name": "Dirección y responsables", "tagline": null, "blocks": [{"t": "p", "x": "Síntesis de varias fuentes para decidir con evidencia."}, {"t": "card", "title": "Resumen ejecutivo", "app": "Chat", "x": "Prepárame un resumen ejecutivo de [proyecto/cliente]. Máximo 400 palabras. Incluye estado, decisiones recientes, riesgos, bloqueos, próximas fechas y decisiones que requieren mi intervención. Distingue hechos de inferencias y da fuentes.", "tip": "Revisa si hay omisiones."}, {"t": "card", "title": "Decisión con evidencia", "app": "Researcher", "x": "Analiza [decisión] usando fuentes internas y externas por separado. Incluye argumentos a favor, en contra, incertidumbres y evidencia que falta.", "tip": "Valora la calidad de las fuentes."}, {"t": "card", "title": "Seguimiento de planes", "app": "Planner", "x": "Muéstrame tareas de esta semana, prioridades y tareas sin responsable o fecha. No modifiques nada.", "tip": "Pide «no modifiques nada» si solo quieres consultar."}]}]}, {"id": "mas", "num": "04", "title": "Lleva Copilot más allá", "intro": {"heading": "Descubre nuevas posibilidades", "blocks": [{"t": "p", "x": "Además de tareas cotidianas, Copilot incluye capacidades para investigar, analizar, trabajar con fuentes de proyectos y configurar asistentes especializados. **No todas son automaciones ni están habilitadas para todos los usuarios.**"}]}, "subs": [{"id": "researcher", "name": "Researcher", "tagline": "De una pregunta a un informe de investigación", "blocks": [{"t": "p", "x": "Researcher/Investigador ayuda a consultar diferentes fuentes, relacionar información y redactar informes estructurados con referencias. Puede resultar valioso para prospectos, estudios de mercado, competidores y tendencias promocionales."}, {"t": "p", "x": "**Cómo empezar:** abre Microsoft 365 Copilot, localiza Researcher entre las herramientas/agentes disponibles, define objetivo, alcance y fechas, añade fuentes si procede; revisa citas y conclusiones.", "role": "howto"}, {"t": "prompt", "x": "Investiga tendencias recientes de fidelización y promociones al consumidor en el mercado español de gran consumo. El objetivo es explorar oportunidades para SAVI. Incluye tendencias, campañas recientes, estrategias de marcas, desafíos, oportunidades hipotéticas y preguntas para Comercial. Usa fuentes recientes y verificables y separa hechos, datos internos e interpretaciones.", "title": "Investigación comercial"}, {"t": "p", "x": "**De investigación a material visual:** aprovecha el informe, una vez comprobado, para crear un documento, presentación o infografía mediante las herramientas de creación de Copilot disponibles. No asegurar que sea un botón dentro del propio Researcher."}, {"t": "p", "x": "**Precaución:** los informes estructurados también pueden incluir citas incorrectas, fuentes desactualizadas o inferencias insuficientes.", "role": "callout", "tone": "warn"}]}, {"id": "analyst", "name": "Analyst", "tagline": "Del Excel a los insights", "blocks": [{"t": "p", "x": "Analyst/Analista ayuda a explorar archivos con datos, comparar periodos, calcular tendencias y detectar anomalías."}, {"t": "p", "x": "**Cómo empezar:** localiza Analyst en Copilot, aporta los archivos, define KPIs, periodo y método de análisis; comprueba cálculos y comparabilidad.", "role": "howto"}, {"t": "prompt", "x": "Analiza estos archivos semanales de campañas. Primero comprueba que campos y periodos sean comparables. Calcula evolución de participaciones, identifica mayores crecimientos y descensos, detecta valores atípicos, crea una tabla y sugiere gráficos. Separa datos observados de posibles explicaciones. No inventes causas.", "title": "Resultados de campaña"}, {"t": "p", "x": "**Precaución:** no sustituye reporting oficial; los KPI deben tener definiciones comunes.", "role": "callout", "tone": "warn"}]}, {"id": "notebooks", "name": "Notebooks", "tagline": "Un espacio para cada proyecto", "blocks": [{"t": "p", "x": "Un Notebook/Cuaderno permite reunir referencias específicas —briefing, propuesta aprobada, bases, actas, reporting— para consultas centradas en ese proyecto. La continuidad depende de las fuentes añadidas y disponibles; no significa acceso irrestricto a todos los sistemas."}, {"t": "prompt", "x": "Utiliza solo las referencias de este Notebook de [campaña]. Resume decisiones confirmadas, avances, asuntos pendientes y contradicciones. Cita cada fuente y señala lo que falta confirmar.", "title": "Prompt"}]}, {"id": "pages", "name": "Pages", "tagline": "Del chat a contenido editable", "blocks": [{"t": "p", "x": "Copilot Pages permite conservar una respuesta para editarla y compartirla en un espacio colaborativo. Por ejemplo, convertir las conclusiones revisadas de una investigación comercial en un documento de trabajo para el equipo."}]}, {"id": "planner", "name": "Planner", "tagline": "Tareas y seguimiento", "blocks": [{"t": "p", "x": "Las funciones de Planner y sus agentes varían por plan, licencia y configuración. No confundir agente de Planner en Copilot con las experiencias integradas en Planner."}, {"t": "prompt", "x": "Muéstrame las tareas de alta prioridad de esta semana en los planes de Planner a los que tengo acceso. Señala vencimientos, tareas pendientes y bloqueos. No hagas modificaciones.", "title": "Prompt"}]}, {"id": "agentes", "name": "Agentes", "tagline": "Configura un asistente especializado", "blocks": [{"t": "p", "x": "Un agente personalizado incorpora instrucciones, objetivos y fuentes definidos para ayudar con tareas repetidas. Puede ofrecer formatos más consistentes, **pero no garantiza respuestas idénticas ni correctas**. Agent Builder es diferente de Copilot Studio y de los agentes específicos de canal."}, {"t": "h3", "x": "¿Cuándo conviene crear un agente?"}, {"t": "ul", "items": ["Tarea repetida con criterios estables.", "Consultas frecuentes sobre la misma documentación aprobada.", "Respuestas estructuradas para un equipo.", "Preparación de minutas, briefings o borradores consistentes."]}, {"t": "p", "x": "Para una consulta puntual, Copilot Chat suele ser suficiente."}, {"t": "h3", "x": "Ideas de agentes SAVI"}, {"t": "ul", "items": ["**Commercial Meeting Insights Assistant:** analiza reuniones, pain points, hipótesis y seguimiento.", "**Asistente de procedimientos de Customer Care:** consulta bases y prepara borradores con referencias.", "**Asistente de estado de campañas:** estructura resúmenes con documentos de proyecto.", "**Asistente de minutas:** decisiones, acciones, responsables y fechas.", "**Asistente de documentación:** busca información en políticas y manuales.", "**Asistente de correos profesionales:** utiliza un formato y tono definidos."]}, {"t": "h3", "x": "Cómo crear tu primer agente con Agent Builder"}, {"t": "ol", "items": ["Abre Microsoft 365 Copilot y busca crear/nuevo agente (si aparece en tu entorno).", "Define una tarea concreta: «analizar reuniones comerciales» en lugar de «ayudarme en todo».", "Escribe instrucciones sobre objetivos, fuentes, formato, límites y cuándo indicar falta de información; añade solo documentos autorizados y vigentes.", "Prueba al menos cinco situaciones representativas, incluidos casos ambiguos y contradictorios; verifica fuentes y salida.", "Guarda y comparte únicamente con usuarios autorizados. Comprueba por separado los permisos del agente y de los documentos asociados."]}, {"t": "h3", "x": "Agente de ejemplo — Commercial Meeting Insights Assistant"}, {"t": "p", "x": "**Objetivo:** apoyar al equipo Comercial en la interpretación de reuniones, detección de necesidades y preparación de seguimiento, sin inventar hechos.", "role": "note", "tone": "accent"}, {"t": "prompt", "x": "Eres un asistente de análisis de reuniones comerciales para SAVI, empresa de soluciones de marketing promocional y fidelización. Cuando el usuario proporcione una transcripción, notas o referencias accesibles: (1) identifica contexto y objetivos; (2) resume necesidades expresadas; (3) identifica pain points y objeciones; (4) distingue necesidades explícitas de hipótesis potenciales; (5) explora oportunidades comerciales solo si existe documentación suficiente del portfolio SAVI; (6) enumera acuerdos confirmados; (7) propone próximos pasos y preguntas de seguimiento. Devuelve siempre: Resumen ejecutivo; Objetivos del cliente; Pain points; Necesidades potenciales; Oportunidades a explorar; Acuerdos; Próximas acciones y responsables; Preguntas para próxima reunión. Cita fuentes disponibles y separa HECHO CONFIRMADO, INFERENCIA e HIPÓTESIS. No inventes fechas, acuerdos, necesidades, responsables ni capacidades de SAVI. Cuando falte información, indica «POR CONFIRMAR».", "title": "Instrucciones completas para copiar en el creador del agente"}, {"t": "p", "x": "**Uso posterior:** «Analiza esta reunión con [cliente] y prepara el informe comercial siguiendo tus instrucciones». El agente necesita acceso autorizado a las fuentes; no se asume que pueda leer automáticamente cualquier reunión.", "role": "note", "tone": "accent"}, {"t": "h3", "x": "Agentes en Teams y canales"}, {"t": "p", "x": "Existen experiencias específicas de agentes para canales de Teams que pueden apoyar consultas y seguimiento donde estén habilitadas. **No afirmar que cualquier Agent Builder puede instalarse en cualquier canal o automatizar tareas de Customer Care**; comprobar disponibilidad y permisos con IT."}, {"t": "h3", "x": "¿Puede automatizar cualquier tarea?"}, {"t": "p", "x": "No. Una cosa es reutilizar instrucciones y fuentes y otra ejecutar acciones, disparar flujos, integrar datos o modificar aplicaciones externas. Para integraciones avanzadas puede requerirse Copilot Studio, conectores, licencias adicionales e intervención de IT. No considerar conectados Salesforce, Jira ni Offer Manager por defecto."}]}]}, {"id": "aprende", "num": "05", "title": "Aprende a utilizarlo bien", "intro": {"heading": "Los mejores resultados empiezan con buenas instrucciones", "blocks": [{"t": "p", "x": "No necesitas conocer cientos de prompts. Lo importante es explicar qué quieres, aportar contexto y verificar la respuesta."}]}, "subs": [{"id": "como-escribir-un-buen-prompt", "name": "Cómo escribir un buen prompt", "tagline": null, "blocks": [{"t": "ul", "items": ["**Objetivo:** qué quieres conseguir.", "**Contexto:** cliente, proyecto, periodo y destinatario.", "**Fuentes:** qué correo, reunión, documento o conjunto de archivos utilizar.", "**Instrucciones:** qué identificar, priorizar y evitar.", "**Formato:** tabla, resumen, lista, email, presentación.", "**Verificación:** citas, distinción entre hechos e hipótesis y vacíos de información."]}, {"t": "p", "x": "No todos los prompts necesitan todos los elementos."}, {"t": "p", "x": "**Poco específico:** «Resume esta reunión».", "role": "compare"}, {"t": "prompt", "x": "Necesito preparar el seguimiento de esta reunión comercial con [cliente]. Utiliza la transcripción accesible e identifica acuerdos confirmados, tareas, responsables y fechas. Devuelve una tabla. Separa decisiones de propuestas abiertas. Si no hay responsable o fecha, escribe «No especificado». Cita referencias cuando estén disponibles.", "title": "Mejorado"}]}, {"id": "no-te-quedes-con-la-primera-respuesta", "name": "No te quedes con la primera respuesta", "tagline": null, "blocks": [{"t": "p", "x": "Utiliza Copilot de forma conversacional: resume, pide profundización, cuestiona hipótesis y transforma el resultado en un entregable."}, {"t": "p", "x": "**Ejemplo de iteración comercial:**", "role": "note", "tone": "example"}, {"t": "ol", "items": ["«Resume las conclusiones de esta reunión».", "«Ahora identifica pain points y necesidades que deberíamos investigar».", "«Separa necesidades confirmadas de hipótesis y propone cinco preguntas».", "«Transforma las conclusiones verificadas en un briefing para mi equipo»."], "role": "convo"}, {"t": "p", "x": "**Frases útiles:** «Cita la fuente», «Separa hechos de recomendaciones», «Si falta información, indícalo», «Identifica contradicciones», «No inventes cifras ni compromisos», «Explícame el cálculo», «¿Qué podría estar pasando por alto?». Estas frases **reducen riesgos, no garantizan precisión**.", "role": "phrases"}]}, {"id": "utiliza-la-informacion-de-forma-responsable", "name": "Utiliza la información de forma responsable", "tagline": null, "blocks": [{"t": "p", "x": "Microsoft 365 Copilot cuenta con protección de datos empresarial. Microsoft señala que las solicitudes, respuestas e información corporativa asociada no se utilizan para entrenar los modelos fundacionales. **Esto no equivale a ausencia de registros**: las interacciones pueden estar sujetas a auditoría, retención y controles corporativos."}, {"t": "p", "x": "Copilot respeta permisos de Microsoft 365, pero no corrige documentos que se hayan compartido demasiado ampliamente. Debes seguir las políticas de confidencialidad y privacidad de SAVI."}, {"t": "h3", "x": "Semáforo orientativo — PENDIENTE DE VALIDAR CON IT/DPO", "pending": true}, {"t": "p", "x": "**Verde:** información laboral ordinaria para la que el tratamiento esté autorizado.\n**Ámbar:** información comercial confidencial, financiera, contractual o datos personales de consumidores; utilizar solo para una finalidad autorizada, con minimización y controles.\n**Rojo:** contraseñas, credenciales y cualquier información o tratamiento no autorizado; no introducir datos excesivos ni divulgar información de terceros.", "tl": ["g", "a", "r"]}, {"t": "p", "x": "**Aviso obligatorio:** este semáforo es una guía provisional para formación, **no una política corporativa aprobada**. Hasta que IT/DPO lo valide, no presentarlo como norma oficial ni sugerir que todo documento «verde» está automáticamente autorizado.", "role": "callout", "tone": "warn"}, {"t": "p", "x": "**Compartir resultados:** antes de distribuir un documento o informe, comprueba que no contiene información de otros clientes, proyectos o personas ajenas a los destinatarios."}]}, {"id": "verifica-antes-de-confiar", "name": "Verifica antes de confiar", "tagline": null, "blocks": [{"t": "p", "x": "**Invención:** aporta algo no respaldado por la fuente.\n**Omisión:** deja fuera una excepción o condición relevante.\n**Inferencia como hecho:** convierte una explicación posible en afirmación confirmada."}, {"t": "p", "x": "**Comprueba:** fuentes originales, cifras y fórmulas, vigencia, responsables, destinatarios, condiciones y diferencia entre hechos e hipótesis. A mayor impacto, mayor revisión humana."}, {"t": "p", "x": "**Método SAVI:** **Pedir → Revisar → Abrir fuentes → Ajustar → Utilizar**."}]}, {"id": "cinco-habitos-para-experimentar", "name": "Cinco hábitos para experimentar", "tagline": null, "blocks": [{"t": "ol", "items": ["Resume un hilo antes de releerlo entero; entra luego al detalle.", "Pide un borrador en lugar de empezar de cero.", "Transforma notas en un email, reuniones en un briefing, informes en una presentación o datos en gráficos.", "Busca información con referencias y comprueba los originales.", "Pide objeciones: «¿Qué debilidades tiene esta propuesta? ¿Qué alternativas explican el resultado?»."]}, {"t": "h3", "x": "Tres ejercicios voluntarios sin datos sensibles"}, {"t": "ul", "items": ["**Precisión:** resume una página de texto en cinco puntos sin añadir hechos.", "**Transformación:** convierte notas ficticias en un email profesional.", "**Verificación:** consulta un documento autorizado y abre las fuentes que sustentan la respuesta."]}, {"t": "p", "x": "**Cierre:** empieza por una tarea habitual. Prueba, verifica y mejora tus instrucciones. El objetivo no es usar IA para todo, sino descubrir dónde ayuda a trabajar mejor.", "role": "note", "tone": "accent"}]}]}], "library": [{"t": "prompt", "title": "Encontrar un correo", "group": "Correo", "app": "Copilot Chat", "x": "Busca el correo en el que [persona] me habló de [tema] durante las últimas semanas. Dime fecha, asunto y qué pedía.", "tip": "No hace falta recordar el asunto exacto: describe lo que recuerdas."}, {"t": "prompt", "title": "Resumir un hilo largo", "group": "Correo", "app": "Outlook", "x": "Resume este hilo. Identifica: 1) solicitud exacta del cliente, 2) compromisos que hemos asumido, 3) fechas mencionadas, 4) preguntas sin respuesta y 5) siguiente acción recomendada. Distingue hechos del hilo de tus recomendaciones.", "tip": "Abre el correo y pulsa «Resumir por Copilot». Comprueba fechas y compromisos en los mensajes originales."}, {"t": "prompt", "title": "Redactar y mejorar un email", "group": "Correo", "app": "Outlook", "x": "Convierte estas notas en un email profesional, cercano y breve para un cliente. Conserva cualquier cifra, fecha o condición tal cual. No añadas compromisos nuevos: [pega tus notas]", "tip": "En un correo nuevo usa «Redactar con Copilot». Puedes ajustar el tono (más formal, más corto…)."}, {"t": "prompt", "title": "Prepararte antes de la reunión", "group": "Reuniones", "app": "Outlook", "x": "Prepárame para la reunión con [cliente] de hoy. Resume los últimos acuerdos, tareas pendientes, cuestiones que probablemente debamos resolver y documentos relevantes. Para cada punto, cita la fuente. No añadas hechos no documentados.", "tip": "Desde el evento del calendario. Depende de que haya correos y documentos relacionados."}, {"t": "prompt", "title": "Resumir o revisar un documento", "group": "Documentos", "app": "Word", "x": "Resume este procedimiento en: objetivo, requisitos previos, pasos, excepciones, puntos de control y escalación. Después identifica cualquier instrucción que parezca contradictoria o ambigua, pero no la corrijas sin marcarla.", "tip": "Copilot propone, tú decides: compara antes de reemplazar."}, {"t": "prompt", "title": "Reescribir para otro público", "group": "Documentos", "app": "Word", "x": "Reescribe esta sección para un cliente no técnico. Mantén todos los hechos, fechas, cifras y condiciones; elimina redundancias; usa un tono profesional y claro. No añadas compromisos que no figuren en el original.", "tip": "Selecciona el texto y pulsa Copilot."}]}</script>
<script type="application/json" data-lang="en">{"sections": [{"id": "descubre", "num": "01", "title": "Discover Copilot", "chunks": [{"heading": "Copilot works with you. And you already have it.", "blocks": [{"t": "p", "x": "Artificial intelligence is already part of our work environment at SAVI."}, {"t": "p", "x": "With Microsoft 365 Copilot you can find information, summarize conversations, prepare documents, analyze data and make better use of your meetings, using the tools you already know."}, {"t": "p", "x": "**You don’t need to be an AI expert. You just need to know where to start.**"}], "key": "hero"}, {"heading": "What is Microsoft 365 Copilot?", "blocks": [{"t": "p", "x": "It is an artificial intelligence assistant built into Microsoft 365 applications and also available from its own app. It can work with the context of your professional environment: emails, meetings, conversations and documents you have access to, depending on the enabled sources and features."}], "key": "what"}, {"heading": "What can you do with it?", "blocks": [{"t": "p", "x": "**Find information.** Locate conversations, decisions and documents related to your projects.\n*Example:* “What did we agree with this client about the next campaign?”"}, {"t": "p", "x": "**Get more from your meetings.** In Teams you can transcribe meetings when authorized; Copilot can use the available information to summarize topics, identify decisions, organize pending items and prepare follow-up emails.\n*Example:* “Summarize this sales meeting; identify agreements and owners, and draft a follow-up.”"}, {"t": "p", "x": "**Summarize what matters.** Turn long emails, conversations and documents into clear summaries.\n*Example:* “Summarize this thread and highlight the open items.”"}, {"t": "p", "x": "**Prepare content.** Create drafts of emails, documents, proposals and presentations to review and personalize.\n*Example:* “Prepare an update email about this campaign.”"}, {"t": "p", "x": "**Analyze and explore.** Compare results, identify trends, research markets and discover potential opportunities.\n*Example:* “Compare the participation results for these weeks.”"}], "key": "capabilities"}, {"heading": "Where can you find Copilot?", "blocks": [{"t": "p", "x": "**Copilot app:** open [copilot.cloud.microsoft](https://copilot.cloud.microsoft/) with your SAVI work account; check that you can actually access it from the corporate environment. It may also be available as a desktop app."}, {"t": "p", "x": "**Inside the apps:** Outlook, Teams, Word, Excel, PowerPoint and other Microsoft 365 tools include Copilot experiences. You can ask for help while you work."}, {"t": "p", "x": "Can’t see Copilot? Make sure you are signed in with your work account and contact IT if it still does not appear."}], "key": "where"}, {"heading": "How does it connect with your work?", "blocks": [{"t": "ul", "items": ["**Microsoft 365:** Outlook emails, Teams meetings and conversations, OneDrive and SharePoint files, depending on access and features.", "**Internet:** public information for research, when the tool allows searching the web.", "**What you provide:** documents, text, files and specific references."]}, {"t": "p", "x": "**Important:** Copilot does not automatically access everything in SAVI. It respects corporate permissions, but it does not fix misconfigured permissions. With our current setup, you should not assume that Salesforce, Jira or Offer Manager are automatically connected.", "role": "callout", "tone": "info"}], "key": "connect"}, {"heading": "Copilot helps. You decide.", "blocks": [{"t": "p", "x": "AI can speed up tasks, but it can also make mistakes, omit information or misinterpret a piece of data. Before using an answer with a client or making a decision, check the sources and review the results."}, {"t": "p", "x": "**Copilot does not replace your experience or professional judgment. It complements them.**"}], "key": "control"}, {"heading": "Where do you want to start?", "blocks": [{"t": "p", "x": "**Copilot in your day-to-day work:** apps, instructions and prompts.\n**Copilot in your department:** real cases related to your team’s work."}], "key": "start", "targets": ["dia", "depto"]}]}, {"id": "dia", "num": "02", "title": "Copilot in your day-to-day work", "intro": {"heading": "The tools you already use, now with AI", "blocks": [{"t": "p", "x": "Copilot is built into several of the applications we use every day at SAVI. Select an application to find out what you can do, how to get started and which instructions to try. **Screens and buttons may vary depending on the version available**."}]}, "subs": [{"id": "copilot-app", "name": "Copilot App", "tagline": "Your entry point to connected work", "blocks": [{"t": "p", "x": "The Microsoft 365 Copilot app lets you ask questions, create content and retrieve information from different tools in one place. You can find an Outlook email, information related to a Teams meeting or a SharePoint file without having to search each application manually."}, {"t": "p", "x": "**What you can do**"}, {"t": "ul", "items": ["Search for emails, documents, conversations and meetings available to you.", "Retrieve agreements, dates and pending tasks for a campaign.", "Prepare meetings with context and discovery questions.", "Organize priorities based on documented commitments.", "Write, translate and transform content; access agents and research."]}, {"t": "p", "x": "**How to get started**"}, {"t": "ol", "items": ["Open Microsoft 365 Copilot with your SAVI account.", "When you search for corporate information, use the work context/Work IQ if that control is available.", "State the client, project and period; then ask your question.", "Check the sources before relying on the results."]}, {"t": "prompt", "x": "Search for information related to [campaign] over the last 30 days in the Microsoft 365 sources I have access to. Summarize confirmed agreements, pending tasks, owners and committed dates. Include references to emails, meetings or documents. If any information is missing, say so.", "title": "Retrieve information about a campaign"}, {"t": "prompt", "x": "I am meeting with [client]. Prepare a briefing with recent interactions, previous agreements, concerns raised, pending topics and five discovery questions. Separate facts from suggestions and cite the sources.", "title": "Prepare a sales meeting"}, {"t": "prompt", "x": "Review the commitments and dates documented in my emails and meetings this week. Suggest priorities, explain why and cite the sources. Do not assume dates or responsibilities.", "title": "Organize my priorities"}, {"t": "p", "x": "**Keep in mind:** if Copilot does not find something, that does not mean it does not exist. The answer depends on sources, permissions, indexing and configuration.", "role": "callout", "tone": "info"}]}, {"id": "outlook", "name": "Outlook", "tagline": "Less time managing email", "blocks": [{"t": "p", "x": "Copilot helps you understand threads, write replies, improve tone, translate communications, prepare meetings and, in some versions, prioritize new messages."}, {"t": "p", "x": "**What you can do**"}, {"t": "ul", "items": ["Summarize a long conversation and extract requests and commitments.", "Draft replies, new emails and shorter or more formal versions.", "Translate messages while keeping names, figures and conditions.", "Prepare for meetings using your calendar, emails and available files.", "Explore “Prioritize my inbox” if IT has enabled it; the classification applies to new messages after the feature is turned on."]}, {"t": "p", "x": "**How to summarize an email:** open the thread, select Copilot’s summarize function, read the key points and check the original content when there is sensitive data or commitments."}, {"t": "p", "x": "**How to prepare a reply:** open the message, select Reply and use the Copilot drafting tools available; explain your intent and tone, insert the draft if appropriate and review it before sending. Automatic reference to the thread varies by client and workflow: do not assume it always happens.", "role": "howto"}, {"t": "prompt", "x": "Summarize this thread. Identify the client’s original request, our replies, confirmed agreements, dates and pending items. Finish with next actions. Do not confuse proposals with confirmed commitments.", "title": "Summarize a thread"}, {"t": "prompt", "x": "Write a professional, friendly reply for this client. Confirm receipt, explain what we are reviewing and mention only the next steps already agreed. Do not add commitments or deadlines that are not confirmed.", "title": "Draft a professional reply"}, {"t": "prompt", "x": "Make this draft clearer, more persuasive and focused on value for the client. Keep all figures and conditions. Provide a short version and a fuller one; do not invent benefits or results.", "title": "Improve a sales email"}, {"t": "prompt", "x": "Translate this message into the recipient’s language using a natural, professional tone. Keep the original names, figures, dates and conditions.", "title": "Translate"}, {"t": "p", "x": "**Explore — Prioritize the inbox:** “Treat as priority the messages that require action on active campaigns, important incidents, client deliverables or upcoming deadlines.” The feature depends on availability; it does not replace protocols or SLAs.", "role": "note", "tone": "explore"}, {"t": "p", "x": "**Keep in mind:** check recipients, figures, dates, conditions and commitments; you are responsible for sending.", "role": "callout", "tone": "info"}]}, {"id": "teams", "name": "Teams", "tagline": "Meetings, chats, channels and agents", "blocks": [{"t": "p", "x": "Teams brings together conversations, decisions, files and coordination. Copilot can help retrieve information from accessible chats and channel threads, support meetings and prepare follow-up. **This does not mean it automatically reviews all historical messages in a channel**."}, {"t": "p", "x": "**What you can do**"}, {"t": "ul", "items": ["Prepare for a meeting; catch up if you join late.", "Review what was discussed in a meeting and summarize decisions.", "Transcribe meetings when authorized, without having to record the video.", "Draft meeting minutes, actions, owners and follow-up emails.", "Summarize accessible chats and channel threads.", "Explore channel agents when IT enables that specific experience; do not equate these agents with Agent Builder."]}, {"t": "h3", "x": "Main case: sales meeting with a client"}, {"t": "p", "x": "**1. Before — prepare**: retrieve previous agreements, client concerns and open items."}, {"t": "prompt", "x": "Prepare me for my next meeting with [client]. Summarize recent agreements, pending items and documented commitments; suggest points that should be clarified. Cite sources and separate recommendations from facts."}, {"t": "p", "x": "**2. During — listen**: if authorized, start the transcription from the meeting controls. You can consult Copilot during certain meetings even without transcribing them. The menu location and available features vary."}, {"t": "prompt", "x": "Summarize the topics covered so far. Separate confirmed decisions, proposals that are still open and pending questions."}, {"t": "p", "x": "**3. After — turn it into actions**: use the recap and accessible content, ideally a transcript when you need to check specific statements."}, {"t": "prompt", "x": "Analyze this sales meeting. Summarize topics, confirmed agreements, tasks, owners, dates and open questions. Separate decisions from proposals. If something was not mentioned, write “Not specified” and cite the available evidence."}, {"t": "p", "x": "**4. Follow-up — email**:"}, {"t": "prompt", "x": "Write a follow-up email for [client] based only on confirmed agreements. Include thanks, decisions and next steps; do not add new commitments."}, {"t": "p", "x": "**5. Sales insight — understand the needs**:"}, {"t": "prompt", "x": "Analyze this meeting with [client] from a sales perspective. Identify objectives, pain points, frustrations, stated needs, potential needs, opportunities worth exploring and questions for the next meeting. Clearly differentiate facts, inferences and hypotheses. Do not claim that SAVI can offer a solution without documentation of our portfolio. Quote excerpts from the meeting where possible."}, {"t": "prompt", "x": "Summarize the accessible messages in this Customer Care thread. Identify incidents handled, confirmed solutions and pending topics. Cite the relevant messages. Do not assume you have access to all conversations in the channel.", "title": "Explore — chats and channels"}, {"t": "prompt", "x": "I have just joined this meeting. What decisions have been made so far and which points are still open?"}, {"t": "p", "x": "**Explore — Teams agents:** when enabled, channel-specific agents can assist with queries and follow-ups; their availability and actions depend on IT. We go deeper in section 04.", "role": "note", "tone": "explore"}, {"t": "p", "x": "**Keep in mind:** notices and transcription policies for external clients; a summary does not replace written agreements. A transcript is not a universal requirement for every summary, but it is usually useful for checking what was said afterwards.", "role": "callout", "tone": "info"}]}, {"id": "excel", "name": "Excel", "tagline": "From data to conclusions", "blocks": [{"t": "p", "x": "Copilot in Excel can help create and explain formulas, calculate variations, analyze trends, generate charts and pivot tables, and sort data."}, {"t": "p", "x": "**How to get started:** open a workbook with clear data and headers; select Copilot; explain the calculation or chart; review formulas, ranges and results.", "role": "howto"}, {"t": "prompt", "x": "In this table, create a column that calculates the percentage change versus the previous period. Explain the formula to me and how it handles blanks and division by zero.", "title": "Growth formula"}, {"t": "prompt", "x": "Compare entries for [month A] and [month B] by campaign. Calculate absolute and percentage change, identify the most relevant changes and show a summary table. Explain the method.", "title": "Compare campaigns"}, {"t": "prompt", "x": "Generate a chart of weekly entries by campaign using this table. Include a title, axes and a legible legend.", "title": "Chart"}, {"t": "prompt", "x": "Create a pivot table that groups entries by campaign and week and shows totals and change between periods. Describe the fields used.", "title": "Pivot table"}, {"t": "p", "x": "**Keep in mind:** verify every calculation and the definition of the KPIs. The former `=COPILOT()` cell function was withdrawn in September 2026; this does not mean that Copilot in Excel has disappeared.", "role": "callout", "tone": "info"}]}, {"id": "word", "name": "Word", "tagline": "From scattered information to professional documents", "blocks": [{"t": "p", "x": "Create drafts, summarize, reorganize, improve text, translate documents and use available sources from emails or meetings to prepare content (depending on capabilities and access)."}, {"t": "p", "x": "**How to get started:** open Word; request a new document or select text; provide sources and structure; review the draft.", "role": "howto"}, {"t": "prompt", "x": "Based on the available information from this sales meeting with [client], create a document with context, objectives, confirmed agreements, stated needs, commercial hypotheses, next steps and owners. Do not invent commitments; cite sources when available.", "title": "From meeting to briefing"}, {"t": "prompt", "x": "Using this approved briefing, write a first draft of a proposal: context, objectives, needs, proposed solution, potential benefits and next steps. Mark [TO BE CONFIRMED] wherever prices, deadlines, scope or documented capabilities are missing.", "title": "Sales proposal"}, {"t": "prompt", "x": "Review this procedure and identify ambiguous instructions, insufficient steps and contradictions. Indicate the section and a suggested improvement without altering the original conditions.", "title": "Review a procedure"}, {"t": "prompt", "x": "Translate this section into [language] using promotional marketing terminology. Keep figures, dates, conditions and formatting. Flag doubtful terms for human review.", "title": "Translate a document"}, {"t": "p", "x": "**Keep in mind:** contracts, legal terms and official procedures require competent validation. A draft is not the same as an approved document.", "role": "callout", "tone": "info"}]}, {"id": "powerpoint", "name": "PowerPoint", "tagline": "From documents to presentations", "blocks": [{"t": "p", "x": "Copilot can generate first slides, structure narratives, make use of existing documents, summarize presentations and improve text and design. The result needs editing and brand adaptation."}, {"t": "h3", "x": "Highlighted cross-app flow"}, {"t": "p", "x": "**Outlook or Teams → verified summary → Word/briefing → PowerPoint**. Meetings and emails can provide the context; do not promise that any transcript turns into a presentation automatically with one click."}, {"t": "p", "x": "**How to get started:** open PowerPoint; select creation with Copilot; reference an approved document or describe the objective and audience; review and adapt.", "role": "howto"}, {"t": "prompt", "x": "Create an eight-slide presentation based on this approved document: client context, objectives, challenges, opportunities, solution, potential benefits, next steps and conclusion. Do not invent figures or features.", "title": "Sales presentation"}, {"t": "prompt", "x": "Turn this report into six executive slides covering objectives, mechanics, main KPIs, performance, learnings and recommendations. Use only documented data, and charts where they add clarity.", "title": "Campaign results"}, {"t": "p", "x": "**Keep in mind:** confirm the narrative, content, figures and branding before presenting to clients.", "role": "callout", "tone": "info"}]}, {"id": "sharepoint", "name": "SharePoint", "tagline": "Find and organize shared content", "blocks": [{"t": "p", "x": "It lets you search content and, depending on configuration and permissions, create or manage files and some SharePoint elements. A create/move files demo has already been shown at SAVI; that does not mean it is universally available."}, {"t": "p", "x": "**How to get started:** go to the relevant site/library; check whether Copilot appears; specify your request; ask for a proposal before applying changes.", "role": "howto"}, {"t": "prompt", "x": "Search this space for the documents of [campaign]: briefing, approved proposal, terms and conditions, and reports. Tell me which versions you find and their references, without assuming that the most recent one is the officially valid one.", "title": "Find documentation"}, {"t": "prompt", "x": "Review this library and propose a structure by document type. List what you would move and where. Do not apply any changes until I confirm.", "title": "Reorganize without changing anything yet"}, {"t": "prompt", "x": "Propose the initial structure for the [project] folder: briefing, proposal, legal, deliverables and reporting. Show me the plan before creating or moving any files.", "title": "Folder structure"}, {"t": "p", "x": "**Keep in mind:** renaming or moving shared resources affects colleagues and processes; check permissions and dependencies.", "role": "callout", "tone": "info"}]}, {"id": "onedrive", "name": "OneDrive", "tagline": "Summarize and compare files", "blocks": [{"t": "p", "x": "It lets you summarize documents, ask questions about them and **compare up to five selected files**, when the experience is compatible and accessible."}, {"t": "p", "x": "**How to get started:** select documents; open the Copilot features available in OneDrive or reference the files from the Copilot app; review and check the sources.", "role": "howto"}, {"t": "prompt", "x": "Compare these documents on dates, eligibility, mechanics, prizes, limits, obligations and exceptions. Generate a table with topic, version A, version B, potential impact and a reference to the document/section. Do not decide which version is official without evidence.", "title": "Comparison of promotion terms and conditions"}, {"t": "prompt", "x": "Summarize this document: objective, requirements, conditions, exceptions and control points. Do not add information that is not there.", "title": "Summarize a document"}, {"t": "p", "x": "**Keep in mind:** comparing versions does not by itself determine which one is officially approved.", "role": "callout", "tone": "info"}]}]}, {"id": "depto", "num": "03", "title": "Copilot in your department", "intro": {"heading": null, "blocks": [{"t": "p", "x": "Every team has different tasks. Choose your department, explore examples and adapt the prompts to your projects. Here we show **applied cases**; we do not repeat interface tutorials."}]}, "subs": [{"id": "comercial", "name": "Sales", "tagline": "From conversations to opportunities", "blocks": [{"t": "p", "x": "Copilot can help you get to know the client, research their market, analyze pain points and formulate commercial hypotheses. Its value is not only productivity, but better preparation to uncover opportunities to create value."}, {"t": "h3", "x": "Featured case — Meeting → opportunity → proposal"}, {"t": "ol", "items": ["**Prepare (Copilot App / Outlook):** retrieve history, agreements, concerns and pending questions.", "**Listen and understand (Teams):** use the transcript when authorized; identify objectives, problems and objections.", "**Detect (Copilot App / Researcher):** separate explicit needs from hypotheses; research if necessary.", "**Propose (Word):** draft a briefing and link opportunities to documented, real SAVI services.", "**Present (PowerPoint):** turn the reviewed briefing into slides and prepare the follow-up."]}, {"t": "p", "x": "**Conceptual example:** if a client says they do not know whether their consumers buy again, the need to measure repeat purchase is supported; a loyalty mechanic could be a commercial hypothesis, not a confirmed solution. Research before proposing.", "role": "note", "tone": "example"}, {"t": "p", "x": "From competitor analysis to strategy, including what the client says."}, {"t": "card", "title": "Research a prospect", "app": "Researcher", "x": "Research [company] to prepare a possible collaboration in promotional marketing and loyalty. Include profile, main brands, recent initiatives, facts backed by sources and possible opportunities. Clearly separate hypotheses from confirmed needs.", "tip": "A commercial hypothesis is not a confirmed need."}, {"t": "card", "title": "Meeting briefing", "app": "Chat", "x": "I am meeting with [client]. Gather the available context of our relationship: background, agreements, concerns raised, pending topics and five discovery questions. Cite the sources. Separate facts from recommendations.", "tip": "Always ask for citations."}, {"t": "card", "title": "Find and compare competitors", "app": "Researcher", "x": "Research the relevant competitors of [company] in [market], their recent promotion and loyalty initiatives and differences in positioning. Present a table with sources and dates; separate verified data from your inferences.", "tip": "Check the sources it cites before using them in a proposal."}, {"t": "card", "title": "Improve an email for the client", "app": "Outlook", "x": "Improve this email for [client]: make it clear, friendly and value-oriented. Keep figures, conditions and dates. Provide a short version and a fuller one; do not invent benefits or commitments.", "tip": "Check that the tone fits your relationship with the client."}, {"t": "card", "title": "Detect client needs", "app": "Teams / Chat", "x": "Analyze the available transcript of the meeting with [client]. Identify objectives, pain points, objections, stated needs and potential needs. For each point provide evidence or mark it [HYPOTHESIS]. Also flag what we should validate with the client.", "tip": "Works best if the meetings were transcribed. A deduced need must be confirmed with the client."}, {"t": "card", "title": "Create a strategy from the conversations", "app": "Chat / Researcher", "x": "Based on documented needs of [client] and relevant external sources, propose three commercial lines we could explore. For each one: problem, evidence, possible SAVI response only if it is documented in our portfolio, risks and open questions. Separate facts from hypotheses.", "tip": "It is a starting point for thinking, not a closed strategy. Validate it with your team."}, {"t": "card", "title": "First draft of a proposal", "app": "Word", "x": "Using the approved commercial briefing, write a draft proposal in Word: context, objectives, needs, solution, potential benefits and next steps. Do not invent prices or deadlines; use [TO BE CONFIRMED] where information is missing.", "tip": "Check scope and price."}, {"t": "card", "title": "From document to presentation", "app": "PowerPoint", "x": "Turn this approved document into eight sales slides, connecting client problems with documented SAVI solutions. Do not invent data, results or testimonials.", "tip": "Check branding and figures."}]}, {"id": "customer-success", "name": "Customer Success", "tagline": null, "blocks": [{"t": "p", "x": "Less time reading threads, more time with the client."}, {"t": "card", "title": "Review long threads", "app": "Outlook", "x": "Summarize this thread as: client request, our response, commitments, pending items and next action.", "tip": "Check the commitment against the email."}, {"t": "card", "title": "Prepare the client meeting", "app": "Outlook / Chat", "x": "Reconstruct the context of [client] over the last 30 days with sources: decisions, open tasks and unresolved matters.", "tip": "Depends on your permissions and available content."}, {"t": "card", "title": "Minutes with actions", "app": "Teams", "x": "Based on the accessible content of this meeting, create meeting minutes with confirmed decisions, tasks, owner and date. Write “Not specified” when any is missing and include available evidence or reference.", "tip": "To check precisely what was said afterwards, use an available transcript when authorized; the options depend on your Teams configuration."}, {"t": "card", "title": "Campaign status", "app": "Notebook", "x": "Based exclusively on the available sources for [campaign], prepare a campaign status with progress, decisions, incidents, pending items and contradictions, citing the documents. Do not replace the official reporting systems.", "tip": "It does not replace the official tracking tool."}]}, {"id": "customer-care-call-center", "name": "Customer Care / Call Center", "tagline": null, "blocks": [{"t": "p", "x": "Support for the agent, not automatic replies to the consumer."}, {"t": "card", "title": "Prepare a reply to the consumer", "app": "Chat / Agent", "x": "The consumer asks: “[query]”. Search only the approved documentation of promotion [X]. State the applicable answer, cite the exact condition and flag any information that must be confirmed before replying. Do not invent exceptions.", "tip": "No consumer personal data in the prompt."}, {"t": "card", "title": "Promotion conditions", "app": "Chat", "x": "According to the conditions of [promotion], prepare a reply to the consumer. Cite the clause and flag what information is missing.", "tip": "Review tone and personal data."}, {"t": "card", "title": "Summarize a complaint", "app": "Outlook", "x": "Summarize this complaint: reason, history, what the consumer is asking for and what should be escalated.", "tip": "Complaints are escalated according to the protocol."}, {"t": "card", "title": "Follow up on incidents in Teams", "app": "Teams", "x": "Summarize the accessible messages in this Customer Care thread, identifying incidents, confirmed solutions and pending topics. Cite the relevant messages; do not assume you have the whole channel.", "tip": "Accessible thread ≠ complete channel history."}, {"t": "card", "title": "Explore mailbox statistics", "app": "Copilot App / Agent", "x": "For the mailbox [mailbox] and the period [dates], identify what volume, recurring subjects and data you can verify with the available sources. Separate verified figures from metrics that would require a complete extraction. Do not calculate SLA, backlog or response times without sufficient data and methodology.", "tip": "Official metrics require definitions and complete records."}]}, {"id": "operaciones-y-validacion", "name": "Operations & Validation", "tagline": null, "blocks": [{"t": "p", "x": "The safest cases: retrieving procedures and comparing versions."}, {"t": "card", "title": "Validity conditions", "app": "Chat / Word", "x": "Based exclusively on the documents provided, state the conditions an entry must meet to be valid. For each condition cite the document and section. If two sources contradict each other, do not choose one: point out the contradiction.", "tip": "Never ask it to “decide” whether an entry is valid without saying which document governs."}, {"t": "card", "title": "Compare versions of terms and conditions", "app": "OneDrive", "x": "Compare these documents only on conditions, deadlines, exceptions and responsibilities.", "tip": "Check that each version is current."}, {"t": "card", "title": "Structure an incident", "app": "Chat", "x": "Organize this incident into: what is happening, who is affected, applicable procedure (with source) and next step. Indicate what information is missing.", "tip": "Copilot proposes; the decision is yours."}, {"t": "card", "title": "Procedures agent", "app": "Agent (future)", "x": "Respond exclusively with the current, approved procedures provided. Cite document and section. If information is missing or there are contradictions, recommend escalating without deciding on your own.", "tip": "Only once versioning and permissions are resolved."}]}, {"id": "finanzas-y-administracion", "name": "Finance & Administration", "tagline": null, "blocks": [{"t": "p", "x": "Copilot speeds up analysis; accounting controls remain yours."}, {"t": "card", "title": "Budget vs actual", "app": "Excel", "x": "Compare budget and actual by category. Calculate absolute and percentage deviation. Sort by financial impact. Show me the formulas or the reasoning before writing conclusions.", "tip": "The workbook and its formulas are the audit source."}, {"t": "card", "title": "Possible duplicates", "app": "Excel", "x": "Look for potentially duplicate records using [fields]. Do not delete anything: create a list for review.", "tip": "Always a list to review, never automatic deletion."}, {"t": "card", "title": "Monthly anomalies", "app": "Analyst", "x": "Analyze the monthly trend and flag outliers. Distinguish a statistical outlier from a confirmed error.", "tip": "Do not use it as the final financial control."}]}, {"id": "direccion-y-responsables", "name": "Leadership & Managers", "tagline": null, "blocks": [{"t": "p", "x": "Synthesis of several sources to decide with evidence."}, {"t": "card", "title": "Executive summary", "app": "Chat", "x": "Prepare an executive summary of [project/client] for me. Maximum 400 words. Include status, recent decisions, risks, blockers, upcoming dates and decisions that require my involvement. Distinguish facts from inferences and give sources.", "tip": "Check for omissions."}, {"t": "card", "title": "Decision with evidence", "app": "Researcher", "x": "Analyze [decision] using internal and external sources separately. Include arguments for and against, uncertainties and missing evidence.", "tip": "Assess the quality of the sources."}, {"t": "card", "title": "Plan follow-up", "app": "Planner", "x": "Show me this week’s tasks, priorities and tasks without an owner or date. Do not change anything.", "tip": "Ask it to “not change anything” if you only want to look."}]}]}, {"id": "mas", "num": "04", "title": "Take Copilot further", "intro": {"heading": "Discover new possibilities", "blocks": [{"t": "p", "x": "In addition to everyday tasks, Copilot includes capabilities to research, analyze, work with project sources and set up specialized assistants. **Not all of them are automations, and not all are enabled for every user.**"}]}, "subs": [{"id": "researcher", "name": "Researcher", "tagline": "From a question to a research report", "blocks": [{"t": "p", "x": "Researcher helps consult different sources, connect information and write structured reports with references. It can be valuable for prospects, market studies, competitors and promotional trends."}, {"t": "p", "x": "**How to get started:** open Microsoft 365 Copilot, find Researcher among the tools/agents available, define the goal, scope and dates, add sources if appropriate; review citations and conclusions.", "role": "howto"}, {"t": "prompt", "x": "Research recent trends in loyalty and consumer promotions in the Spanish fast-moving consumer goods (FMCG) market. The goal is to explore opportunities for SAVI. Include trends, recent campaigns, brand strategies, challenges, hypothetical opportunities and questions for the Sales team. Use recent, verifiable sources and separate facts, internal data and interpretations.", "title": "Sales research"}, {"t": "p", "x": "**From research to visual material:** once checked, use the report to create a document, presentation or infographic with the Copilot creation tools available. Do not assert that this is a button inside Researcher itself."}, {"t": "p", "x": "**Caution:** structured reports can also include incorrect citations, outdated sources or insufficient inferences.", "role": "callout", "tone": "warn"}]}, {"id": "analyst", "name": "Analyst", "tagline": "From Excel to insights", "blocks": [{"t": "p", "x": "Analyst helps explore files with data, compare periods, calculate trends and detect anomalies."}, {"t": "p", "x": "**How to get started:** find Analyst in Copilot, provide the files, define KPIs, period and analysis method; check calculations and comparability.", "role": "howto"}, {"t": "prompt", "x": "Analyze these weekly campaign files. First check that fields and periods are comparable. Calculate the trend in entries, identify the biggest increases and decreases, detect outliers, create a table and suggest charts. Separate observed data from possible explanations. Do not invent causes.", "title": "Campaign results"}, {"t": "p", "x": "**Caution:** it does not replace official reporting; KPIs must have common definitions.", "role": "callout", "tone": "warn"}]}, {"id": "notebooks", "name": "Notebooks", "tagline": "A space for each project", "blocks": [{"t": "p", "x": "A Notebook lets you gather specific references — briefing, approved proposal, terms and conditions, meeting minutes, reporting — for queries focused on that project. Continuity depends on the sources added and available; it does not mean unrestricted access to all systems."}, {"t": "prompt", "x": "Use only the references in this Notebook for [campaign]. Summarize confirmed decisions, progress, pending matters and contradictions. Cite each source and flag what still needs to be confirmed.", "title": "Prompt"}]}, {"id": "pages", "name": "Pages", "tagline": "From chat to editable content", "blocks": [{"t": "p", "x": "Copilot Pages lets you keep an answer so you can edit it and share it in a collaborative space. For example, turning the reviewed conclusions of a sales research into a working document for the team."}]}, {"id": "planner", "name": "Planner", "tagline": "Tasks and follow-up", "blocks": [{"t": "p", "x": "Planner features and its agents vary by plan, license and configuration. Do not confuse the Planner agent in Copilot with the experiences built into Planner."}, {"t": "prompt", "x": "Show me this week’s high-priority tasks in the Planner plans I have access to. Flag due dates, pending tasks and blockers. Do not make any changes.", "title": "Prompt"}]}, {"id": "agentes", "name": "Agents", "tagline": "Set up a specialized assistant", "blocks": [{"t": "p", "x": "A custom agent incorporates defined instructions, goals and sources to help with repeated tasks. It can deliver more consistent formats, **but it does not guarantee identical or correct answers**. Agent Builder is different from Copilot Studio and from channel-specific agents."}, {"t": "h3", "x": "When is it worth creating an agent?"}, {"t": "ul", "items": ["A repeated task with stable criteria.", "Frequent questions about the same approved documentation.", "Structured answers for a team.", "Preparing consistent minutes, briefings or drafts."]}, {"t": "p", "x": "For a one-off question, Copilot Chat is usually enough."}, {"t": "h3", "x": "SAVI agent ideas"}, {"t": "ul", "items": ["**Commercial Meeting Insights Assistant:** analyzes meetings, pain points, hypotheses and follow-up.", "**Customer Care procedures assistant:** consults terms and conditions and prepares drafts with references.", "**Campaign status assistant:** structures summaries using project documents.", "**Minutes assistant:** decisions, actions, owners and dates.", "**Documentation assistant:** finds information in policies and manuals.", "**Professional emails assistant:** uses a defined format and tone."]}, {"t": "h3", "x": "How to create your first agent with Agent Builder"}, {"t": "ol", "items": ["Open Microsoft 365 Copilot and look for create/new agent (if it appears in your environment).", "Define a specific task: “analyze sales meetings” instead of “help me with everything”.", "Write instructions about goals, sources, format, limits and when to flag missing information; add only authorized, current documents.", "Test at least five representative situations, including ambiguous and contradictory cases; check sources and output.", "Save and share only with authorized users. Check separately the permissions of the agent and of the associated documents."]}, {"t": "h3", "x": "Example agent — Commercial Meeting Insights Assistant"}, {"t": "p", "x": "**Objective:** support the Sales team in interpreting meetings, detecting needs and preparing follow-up, without inventing facts.", "role": "note", "tone": "accent"}, {"t": "prompt", "x": "You are a sales meeting analysis assistant for SAVI, a company that provides promotional marketing and loyalty solutions. When the user provides a transcript, notes or accessible references: (1) identify context and objectives; (2) summarize the needs expressed; (3) identify pain points and objections; (4) distinguish explicit needs from potential hypotheses; (5) explore sales opportunities only if there is sufficient documentation of the SAVI portfolio; (6) list confirmed agreements; (7) propose next steps and follow-up questions. Always return: Executive summary; Client objectives; Pain points; Potential needs; Opportunities to explore; Agreements; Next actions and owners; Questions for the next meeting. Cite available sources and separate CONFIRMED FACT, INFERENCE and HYPOTHESIS. Do not invent dates, agreements, needs, owners or SAVI capabilities. When information is missing, state “TO BE CONFIRMED”.", "title": "Full instructions to copy into the agent builder"}, {"t": "p", "x": "**Later use:** “Analyze this meeting with [client] and prepare the sales report following your instructions.” The agent needs authorized access to the sources; it is not assumed that it can automatically read any meeting.", "role": "note", "tone": "accent"}, {"t": "h3", "x": "Agents in Teams and channels"}, {"t": "p", "x": "There are agent experiences specific to Teams channels that can support queries and follow-up where enabled. **Do not claim that any Agent Builder agent can be installed in any channel or automate Customer Care tasks**; check availability and permissions with IT."}, {"t": "h3", "x": "Can it automate any task?"}, {"t": "p", "x": "No. Reusing instructions and sources is one thing; executing actions, triggering flows, integrating data or modifying external applications is another. Advanced integrations may require Copilot Studio, connectors, additional licenses and IT involvement. Do not assume Salesforce, Jira or Offer Manager are connected by default."}]}]}, {"id": "aprende", "num": "05", "title": "Learn to use it well", "intro": {"heading": "The best results start with good instructions", "blocks": [{"t": "p", "x": "You don’t need to know hundreds of prompts. What matters is to explain what you want, provide context and verify the answer."}]}, "subs": [{"id": "como-escribir-un-buen-prompt", "name": "How to write a good prompt", "tagline": null, "blocks": [{"t": "ul", "items": ["**Goal:** what you want to achieve.", "**Context:** client, project, period and recipient.", "**Sources:** which email, meeting, document or set of files to use.", "**Instructions:** what to identify, prioritize and avoid.", "**Format:** table, summary, list, email, presentation.", "**Verification:** citations, distinction between facts and hypotheses, and information gaps."]}, {"t": "p", "x": "Not every prompt needs every element."}, {"t": "p", "x": "**Not specific enough:** “Summarize this meeting.”", "role": "compare"}, {"t": "prompt", "x": "I need to prepare the follow-up for this sales meeting with [client]. Use the accessible transcript and identify confirmed agreements, tasks, owners and dates. Return a table. Separate decisions from open proposals. If there is no owner or date, write “Not specified”. Cite references when available.", "title": "Improved"}]}, {"id": "no-te-quedes-con-la-primera-respuesta", "name": "Don’t settle for the first answer", "tagline": null, "blocks": [{"t": "p", "x": "Use Copilot conversationally: summarize, ask for more depth, challenge hypotheses and turn the result into a deliverable."}, {"t": "p", "x": "**Sales iteration example:**", "role": "note", "tone": "example"}, {"t": "ol", "items": ["“Summarize the conclusions of this meeting.”", "“Now identify pain points and needs we should investigate.”", "“Separate confirmed needs from hypotheses and suggest five questions.”", "“Turn the verified conclusions into a briefing for my team.”"], "role": "convo"}, {"t": "p", "x": "**Useful phrases:** “Cite the source”, “Separate facts from recommendations”, “If information is missing, say so”, “Identify contradictions”, “Do not invent figures or commitments”, “Explain the calculation to me”, “What might I be overlooking?”. These phrases **reduce risks; they do not guarantee accuracy**.", "role": "phrases"}]}, {"id": "utiliza-la-informacion-de-forma-responsable", "name": "Use information responsibly", "tagline": null, "blocks": [{"t": "p", "x": "Microsoft 365 Copilot includes enterprise data protection. Microsoft states that prompts, responses and associated corporate information are not used to train the foundation models. **This is not the same as having no records**: interactions may be subject to audit, retention and corporate controls."}, {"t": "p", "x": "Copilot respects Microsoft 365 permissions, but it does not fix documents that have been shared too broadly. You must follow SAVI’s confidentiality and privacy policies."}, {"t": "h3", "x": "Indicative traffic light — PENDING VALIDATION BY IT/DPO", "pending": true}, {"t": "p", "x": "**Green:** ordinary work information for which processing is authorized.\n**Amber:** confidential commercial, financial or contractual information, or consumers’ personal data; use only for an authorized purpose, with minimization and controls.\n**Red:** passwords, credentials and any unauthorized information or processing; do not enter excessive data or disclose third-party information.", "tl": ["g", "a", "r"]}, {"t": "p", "x": "**Mandatory notice:** this traffic light is a provisional training guide, **not an approved corporate policy**. Until IT/DPO validate it, do not present it as an official rule or suggest that every “green” document is automatically authorized.", "role": "callout", "tone": "warn"}, {"t": "p", "x": "**Sharing results:** before distributing a document or report, check that it does not contain information about other clients, projects or people who are not among the recipients."}]}, {"id": "verifica-antes-de-confiar", "name": "Verify before you trust", "tagline": null, "blocks": [{"t": "p", "x": "**Invention:** adds something not supported by the source.\n**Omission:** leaves out a relevant exception or condition.\n**Inference as fact:** turns a possible explanation into a confirmed statement."}, {"t": "p", "x": "**Check:** original sources, figures and formulas, validity, owners, recipients, conditions and the difference between facts and hypotheses. The greater the impact, the more human review is needed."}, {"t": "p", "x": "**SAVI method:** **Ask → Review → Open sources → Adjust → Use**."}]}, {"id": "cinco-habitos-para-experimentar", "name": "Five habits to try out", "tagline": null, "blocks": [{"t": "ol", "items": ["Summarize a thread before rereading it in full; then go into the detail.", "Ask for a draft instead of starting from scratch.", "Turn notes into an email, meetings into a briefing, reports into a presentation or data into charts.", "Search for information with references and check the originals.", "Ask for objections: “What weaknesses does this proposal have? What alternatives could explain the result?”"]}, {"t": "h3", "x": "Three optional exercises without sensitive data"}, {"t": "ul", "items": ["**Accuracy:** summarize a page of text in five points without adding facts.", "**Transformation:** turn fictional notes into a professional email.", "**Verification:** consult an authorized document and open the sources that support the answer."]}, {"t": "p", "x": "**Wrap-up:** start with a task you do regularly. Try it, verify it and improve your instructions. The goal is not to use AI for everything, but to find where it helps you work better.", "role": "note", "tone": "accent"}]}]}], "library": [{"t": "prompt", "title": "Find an email", "group": "Email", "app": "Copilot Chat", "x": "Find the email in which [person] spoke to me about [topic] in recent weeks. Tell me the date, subject and what they were asking.", "tip": "You don’t need to remember the exact subject: describe what you remember."}, {"t": "prompt", "title": "Summarize a long thread", "group": "Email", "app": "Outlook", "x": "Summarize this thread. Identify: 1) the client’s exact request, 2) commitments we have made, 3) dates mentioned, 4) unanswered questions and 5) recommended next action. Distinguish facts in the thread from your recommendations.", "tip": "Open the email and select Copilot’s “Summarize” option. Check dates and commitments in the original messages."}, {"t": "prompt", "title": "Write and improve an email", "group": "Email", "app": "Outlook", "x": "Turn these notes into a professional, friendly, brief email for a client. Keep any figure, date or condition exactly as is. Do not add new commitments: [paste your notes]", "tip": "In a new email use “Draft with Copilot”. You can adjust the tone (more formal, shorter…)."}, {"t": "prompt", "title": "Prepare before the meeting", "group": "Meetings", "app": "Outlook", "x": "Prepare me for today’s meeting with [client]. Summarize the latest agreements, pending tasks, matters we will probably need to resolve and relevant documents. For each point, cite the source. Do not add undocumented facts.", "tip": "From the calendar event. Depends on related emails and documents being available."}, {"t": "prompt", "title": "Summarize or review a document", "group": "Documents", "app": "Word", "x": "Summarize this procedure as: objective, prerequisites, steps, exceptions, control points and escalation. Then identify any instruction that seems contradictory or ambiguous, but do not correct it without flagging it.", "tip": "Copilot proposes, you decide: compare before replacing."}, {"t": "prompt", "title": "Rewrite for a different audience", "group": "Documents", "app": "Word", "x": "Rewrite this section for a non-technical client. Keep all facts, dates, figures and conditions; remove redundancies; use a professional, clear tone. Do not add commitments that are not in the original.", "tip": "Select the text and click Copilot."}]}</script>

function toNodes(bl, ctx) {

  while (i < bl.length) {
    const b = bl[i];
    if (b.t === "prompt" || b.t === "card") {
      const items = [];
      while (i < bl.length && (bl[i].t === "prompt" || bl[i].t === "card")) { items.push(mkPrompt(bl[i], ctx, pidx++, label)); i++; }
      out.push({ kind: "prompts", id: id(), items, inTl });

      i++; continue;
    }
    if (b.t === "ul") { inTl = false; out.push({ kind: b.items.every(x => BOLDLEAD.test(x)) ? "feat" : "ul", id: id(), items: b.items }); i++; continue; }

      inTl = false;
      out.push({ kind: b.role === "convo" ? "convo" : b.items.every(x => BOLDLEAD.test(x)) ? "journey" : "ol", id: id(), items: b.items });
      i++; continue;

    if (b.role === "callout") { inTl = false; out.push({ kind: "callout", id: id(), x, warn: b.tone === "warn", toc: leadOf(x).lead }); i++; continue; }
    const st = x.match(/^\*\*(\d+)\.\s*([^*]+)\*\*:?\s*([\s\S]*)$/);
    if (st) { inTl = true; label = `${st[1]}. ${st[2]}`; out.push({ kind: "step", id: id(), n: st[1], label: st[2], rest: st[3] }); i++; continue; }

    if (lines.length >= 2 && lines.every(l => BOLDLEAD.test(l))) { inTl = false; out.push({ kind: "cards", id: id(), lines, tl: b.tl || [] }); i++; continue; }
    if (BOLDONLY.test(x.trim()) && x.includes("→")) { inTl = false; out.push({ kind: "flow", id: id(), lead: "", steps: x.trim().replace(/\*\*/g, "").split("→").map(s => s.trim()) }); i++; continue; }
    if (BOLDONLY.test(x.trim())) { inTl = false; const tx = x.trim().replace(/\*\*/g, ""); label = tx.replace(/[.:]\s*$/, ""); out.push({ kind: "label", id: id(), x: tx, toc: label }); i++; continue; }
    const fl = x.match(/^(\*\*[^*]+\*\*)\s*\*\*([^*]*→[^*]*)\*\*\.?\s*$/);
    if (fl) { inTl = false; out.push({ kind: "flow", id: id(), lead: fl[1], steps: fl[2].split("→").map(s => s.trim()) }); i++; continue; }

}
function buildModel(content) {

    SEC[sec.id] = sec;

      if (sb.isLib) return;
      const ctx = { sec: sec.id, secTitle: sec.title, sub: sb.id, subName: sb.name };
      sb.nodes = toNodes(sb.blocks || [], ctx);
      sb.prompts = sb.nodes.flatMap(n => n.kind === "prompts" ? n.items : n.kind === "compare" ? [n.good] : []);
      sb.toc = []; let first = true;
      sb.nodes.forEach(n => {
        if (n.toc) sb.toc.push({ id: n.id, label: n.toc });
        else if ((n.kind === "prompts" || n.kind === "compare") && first) { first = false; if (sb.prompts.length > 1) sb.toc.push({ id: n.id, label: t("tocPrompts", { n: sb.prompts.length }) }); }
      });
      SUBINDEX.push({ sec: sec.id, secTitle: sec.title, sub: sb.id, name: sb.name, tagline: sb.tagline || "", norm: norm(`${sb.name} ${sb.tagline || ""} ${sec.title}`) });
    });
    if (sec.id === "dia") {
      const name = t("libName");
      const ctx = { sec: "dia", secTitle: sec.title, sub: "prompts", subName: name };
      sec.lib = (C.library || []).map((p, i) => mkPrompt(p, ctx, i, ""));
      sec.subs = sec.subs.filter(s => !s.isLib).concat([{ id: "prompts", name, isLib: true, tagline: "", nodes: [], prompts: sec.lib, toc: [] }]);
      SUBINDEX.push({ sec: "dia", secTitle: sec.title, sub: "prompts", name, tagline: "", norm: norm(`${name} ${sec.title}`) });
    }
  });

}

/* Los prompts que siguen a un paso numerado van dentro de ese paso */
function groupSteps(nodes) {
  const out = [];
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    if (n.kind === "step") {
      const st = Object.assign({}, n, { kids: [] });
      while (nodes[i + 1] && nodes[i + 1].kind === "prompts" && nodes[i + 1].inTl) st.kids.push(nodes[++i]);
      out.push(st);
    } else out.push(n);
  }
  return out;
}

/* ---------- Textos fijos de la plantilla ([data-i18n], [data-i18n-aria]) ---------- */

/* ---------- Selector de idioma (botón + menú de opciones; teclado completo) ---------- */
const langBox = $("#lang"), langBtn = $("#lang-btn"), langMenu = $("#lang-menu");
function renderLangMenu() {

  langMenu.innerHTML = LANGS.map(l => {
    const cur = l.code === state.lang;
    return `<li role="none"><button type="button" role="menuitemradio" class="lang-opt" lang="${l.code}" data-lang="${l.code}" aria-checked="${cur}"${l.ready ? "" : ' aria-disabled="true"'} tabindex="-1">
      <span class="lo-code" aria-hidden="true">${l.short}</span><span class="lo-name">${esc(l.native)}</span>${l.ready ? "" : `<span class="lo-pend">${esc(t("languagePending"))}</span>`}${cur ? ic("ok", "ic lo-ok") : ""}</button></li>`;

function openLang(focusIdx) {
  langBox.classList.add("open"); langBtn.setAttribute("aria-expanded", "true");
  const opts = $$(".lang-opt", langMenu), i = focusIdx ?? Math.max(0, opts.findIndex(o => o.dataset.lang === state.lang));
  opts[i]?.focus();
}
function closeLang(restore) { if (!langBox.classList.contains("open")) return; langBox.classList.remove("open"); langBtn.setAttribute("aria-expanded", "false"); if (restore) langBtn.focus(); }
function setLang(code) {
  if (!isReady(code) || code === state.lang) return false;
  state.lang = code; store.set("savi-copilot-lang", code);
  buildModel(CONTENTS[code]); mountAll(); applyStaticText(); route();
  document.dispatchEvent(new CustomEvent("langchange", { detail: { lang: code } }));
  return true;
}
langBtn?.addEventListener("click", () => langBox.classList.contains("open") ? closeLang() : openLang());
langBtn?.addEventListener("keydown", e => { if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); openLang(e.key === "ArrowUp" ? LANGS.length - 1 : undefined); } });
langMenu?.addEventListener("keydown", e => {
  const opts = $$(".lang-opt", langMenu), i = opts.indexOf(document.activeElement);
  const nx = { ArrowDown: (i + 1) % opts.length, ArrowUp: (i - 1 + opts.length) % opts.length, Home: 0, End: opts.length - 1 }[e.key];
  if (nx !== undefined) { e.preventDefault(); opts[nx].focus(); return; }
